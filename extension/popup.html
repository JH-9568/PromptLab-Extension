<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PromptLab</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon48.png" alt="">
        <div class="brand-copy"><h1>PromptLab</h1><div class="brand-meta"><p data-i18n="popupTagline">Settings</p><span id="server-status" class="status" data-i18n="checking">Checking...</span></div></div>
      </div>
    </header>
    <main>
      <section class="setting-section" aria-labelledby="rewrite-mode-title">
        <h2 id="rewrite-mode-title" data-i18n="rewriteStrength">Rewrite strength</h2>
        <div class="mode-control" role="radiogroup" aria-labelledby="rewrite-mode-title" aria-describedby="mode-description">
          <label><input type="radio" name="rewrite-mode" value="light" disabled><span><i class="mode-mark" aria-hidden="true"><b></b></i><span data-i18n="modeLight">Light</span></span></label>
          <label><input type="radio" name="rewrite-mode" value="balanced" checked disabled><span><i class="mode-mark" aria-hidden="true"><b></b><b></b></i><span data-i18n="modeBalanced">Balanced</span></span></label>
          <label><input type="radio" name="rewrite-mode" value="detailed" disabled><span><i class="mode-mark" aria-hidden="true"><b></b><b></b><b></b></i><span data-i18n="modeDetailed">Detailed</span></span></label>
        </div>
        <p id="mode-description" class="mode-description" data-i18n="modeBalancedDescription">Clearer wording with useful detail.</p>
      </section>
      <section class="setting-section" aria-labelledby="preferences-title">
        <form id="preferences-form">
          <div class="setting-heading">
            <h2 id="preferences-title"><label for="custom-instructions" data-i18n="defaultInstructions">My preferences</label></h2>
            <label class="toggle"><input id="instructions-enabled" type="checkbox" role="switch" data-i18n-aria="applyPreferences" disabled><span aria-hidden="true"></span></label>
          </div>
          <textarea id="custom-instructions" rows="4" maxlength="600" spellcheck="false" data-i18n-placeholder="instructionsPlaceholder" aria-describedby="instructions-privacy" disabled></textarea>
          <div class="editor-footer">
            <output id="instructions-count" for="custom-instructions">0 / 600</output>
            <button id="save-preferences" class="save-button" type="submit" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span data-i18n="savePreferences">Save preferences</span></button>
          </div>
          <p id="instructions-privacy" class="privacy-note" data-i18n="preferencesPrivacy">Stored on this browser. Sent with improvements when enabled.</p>
        </form>
      </section>
      <section class="setting-section" aria-labelledby="border-color-title">
        <div class="setting-heading"><h2 id="border-color-title" data-i18n="borderColor">Input border color</h2><span id="selected-color" class="selected-color"></span></div>
        <div class="color-swatches" role="group" aria-labelledby="border-color-title">
          <button class="color-swatch" type="button" data-color="purple" data-color-i18n="colorPurple" style="--swatch-color:#a855f7"></button>
          <button class="color-swatch" type="button" data-color="blue" data-color-i18n="colorBlue" style="--swatch-color:#3b82f6"></button>
          <button class="color-swatch" type="button" data-color="green" data-color-i18n="colorGreen" style="--swatch-color:#10b981"></button>
          <button class="color-swatch" type="button" data-color="orange" data-color-i18n="colorOrange" style="--swatch-color:#f97316"></button>
          <button class="color-swatch" type="button" data-color="pink" data-color-i18n="colorPink" style="--swatch-color:#ec4899"></button>
          <button class="color-swatch" type="button" data-color="red" data-color-i18n="colorRed" style="--swatch-color:#ef4444"></button>
          <button class="color-swatch" type="button" data-color="teal" data-color-i18n="colorTeal" style="--swatch-color:#14b8a6"></button>
          <button class="color-swatch" type="button" data-color="yellow" data-color-i18n="colorYellow" style="--swatch-color:#eab308"></button>
          <button class="color-swatch" type="button" data-color="indigo" data-color-i18n="colorIndigo" style="--swatch-color:#6366f1"></button>
          <button class="color-swatch" type="button" data-color="gray" data-color-i18n="colorGray" style="--swatch-color:#71717a"></button>
        </div>
      </section>
      <p id="settings-status" role="status" aria-live="polite"></p>
      <details class="diagnostics">
        <summary data-i18n="dataAndDiagnostics">Data &amp; diagnostics</summary>
        <div class="diagnostics-body">
          <div class="detail-row"><span data-i18n="anonymousUserId">Anonymous user_id</span><code id="user-id" data-i18n="loading">Loading...</code></div>
          <div class="detail-row"><span data-i18n="server">Server</span><code>promptlab-server.onrender.com</code></div>
          <div class="links">
            <a href="https://promptlab-server.onrender.com/api/logs/export/json" target="_blank" rel="noreferrer" data-i18n="exportJson">Export JSON</a>
            <a href="https://promptlab-server.onrender.com/api/logs/export/csv" target="_blank" rel="noreferrer" data-i18n="exportCsv">Export CSV</a>
          </div>
        </div>
      </details>
    </main>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
